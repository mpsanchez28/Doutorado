# Gate de qualidade do corpus (Seção 4.3.2 da qualificação).
# Limiares operacionais mínimos — recalibráveis após análise exploratória.
min_works: 5000
min_authors: 2000
min_mean_coauthor_weight: 1.3      # garante colaborações recorrentes
min_pairs_weight_ge_3: 30          # garante grupos de pesquisa estabelecidos
min_abstract_coverage: 0.70        # requisito do módulo textual (CNN)
