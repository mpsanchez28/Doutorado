# ============================================================================
# PERFIS DAS BASES TEMÁTICAS — 4 recortes no NÍVEL DE CAMPO (Concepts nível 0),
# formando um gradiente de densidade de coautoria (H3). Usados por
# scripts/build_base.py. Cada base tem seus Concepts, diretório bruto e corpus
# limpo próprios; idioma/ano/campos obrigatórios vêm de filters.yaml.
# `expected_names` valida os Concept IDs contra a API na hora da coleta — a
# coleta ABORTA se o display_name retornado não corresponder (evita coletar a
# área errada por um ID trocado). IDs e Wikidata conferidos na API em 09/10/2026.
#
# Densidade preliminar (autores/artigo, AMOSTRA ALEATÓRIA da API, n=200, seed=42,
# ≥2004, inglês, com abstract): medicina 5,3 > computação 3,4 > matemática 3,1 ≈
# economia 2,9. ATENÇÃO: a ordem padrão da API é por citações (desc.); nos mais
# citados a densidade infla 1,7–3,0× e INVERTE o gradiente (economia 8,1 > computação
# 6,6). Ver docs/SELECAO_BASES.md — a coleta precisa de amostragem representativa.
# ============================================================================

# Critério de parada da coleta: AUTORES distintos (não works). A unidade da tarefa
# de recomendação de coautoria é o autor — fixar autores iguala o tamanho do
# catálogo de recomendáveis entre as bases; works/autor e densidade passam a ser
# propriedades DA ÁREA (o que a H3 mede), não artefatos da coleta.
target_authors: 60000      # mesmo catálogo bruto para todas as bases do gradiente
max_works: 80000           # teto de segurança (áreas de equipes pequenas exigem mais works)

# Ordem esperada do gradiente (alto → baixo), usada em relatórios/figuras da H3.
gradiente: [medicina, computacao, matematica, economia]

bases:
  medicina:
    label: "Medicina"
    gradiente: true
    densidade_esperada: "alta (equipes grandes, colaborações recorrentes)"
    raw_dir: "data/raw_med"
    corpus: "data/processed/corpus_medicina.parquet"
    concepts:
      - "C71924100"        # Medicine (nível 0; Wikidata Q11190; ~83M works)
    expected_names:
      C71924100: "Medicine"

  computacao:
    label: "Ciência da Computação"
    gradiente: true
    densidade_esperada: "intermediária"
    raw_dir: "data/raw_cs"
    corpus: "data/processed/corpus_computacao.parquet"
    concepts:
      - "C41008148"        # Computer science (nível 0; Wikidata Q21198; ~165M works)
    expected_names:
      C41008148: "Computer science"

  matematica:
    label: "Matemática"
    gradiente: true
    densidade_esperada: "baixa (artigos de 1–3 autores; polo esparso clássico)"
    raw_dir: "data/raw_math"
    corpus: "data/processed/corpus_matematica.parquet"
    concepts:
      - "C33923547"        # Mathematics (nível 0; Wikidata Q395; ~42M works)
    expected_names:
      C33923547: "Mathematics"

  economia:
    label: "Economia"
    gradiente: true
    densidade_esperada: "baixa (artigos de 1–3 autores, rede esparsa)"
    raw_dir: "data/raw_econ"
    corpus: "data/processed/corpus_economia.parquet"
    concepts:
      - "C162324750"       # Economics (nível 0; Wikidata Q8134; ~23M works)
    expected_names:
      C162324750: "Economics"

  # --- Legado: sub-campo de IA (5 sub-conceitos) — base de TODOS os experimentos
  # até out/2026. Fora do gradiente (granularidade diferente das demais); mantida
  # para reprodutibilidade dos resultados já publicados no repositório.
  ia:
    label: "Inteligência Artificial e correlatas (sub-campo, legado)"
    gradiente: false
    densidade_esperada: "intermediária"
    raw_dir: "data/raw_ai"
    corpus: "data/processed/corpus_ia.parquet"
    concepts:
      - "C154945302"       # Artificial intelligence
      - "C119857082"       # Machine learning
      - "C204321447"       # Natural language processing
      - "C31972630"        # Computer vision
      - "C108583219"       # Deep learning
    expected_names:
      C154945302: "Artificial intelligence"
      C119857082: "Machine learning"
      C204321447: "Natural language processing"
      C31972630: "Computer vision"
      C108583219: "Deep learning"
