# ============================================================================
# PERFIS DAS BASES TEMÁTICAS — 4 recortes no NÍVEL DE CAMPO, formando um gradiente
# de densidade de coautoria (H3). Usados por scripts/build_base.py. Cada base tem
# sua área, diretório bruto e corpus próprios; idioma/ano/campos obrigatórios vêm
# de filters.yaml.
#
# ÁREA = CAMPO DO *PRIMARY TOPIC* (OpenAlex Topics: domínio > campo > subcampo >
# tópico; campos = classificação ASJC). Cada trabalho tem UM primary topic → UM
# campo (partição limpa). NÃO usar Concepts: estão descontinuados e o filtro
# `concepts.id` casa QUALQUER marcação, inclusive score 0 — em amostra aleatória,
# 52–90% dos trabalhos "de Concept X" têm outro campo principal (ex.: colaborações
# de física com Economics score 0,0). `expected_names` valida os IDs contra a API
# antes de coletar (aborta se o nome não bater). Conferidos em 09/10/2026.
#
# Densidade (autores/artigo, amostra ALEATÓRIA, filtro por campo, n=200, seed=42,
# ≥2004, inglês, com abstract): medicina 6,0 > computação 2,9 > matemática 2,2 ≈
# economia 2,1. A ordem padrão da API (por citações) infla e inverte o gradiente —
# por isso a coleta usa sementes aleatórias (docs/SELECAO_BASES.md).
# ============================================================================

# Critério de parada da coleta: AUTORES distintos (não works). A unidade da tarefa
# de recomendação de coautoria é o autor — fixar autores iguala o tamanho do
# catálogo de recomendáveis entre as bases; works/autor e densidade passam a ser
# propriedades DA ÁREA (o que a H3 mede), não artefatos da coleta.
target_authors: 60000      # mesmo catálogo bruto para todas as bases do gradiente
max_works: 80000           # teto de segurança (áreas de equipes pequenas exigem mais works)

# Amostragem (aprovada em 09/10/2026): sementes ALEATÓRIAS + histórico completo.
# Evita o viés da ordem padrão da API (por citações) e preserva a estrutura da rede.
coleta:
  modo: "seeded"
  sample_size: 2000          # works por sorteio aleatório (limite da API: 10.000)
  sample_seeds: [42, 43, 44, 45, 46, 47, 48, 49]   # sorteios usados em sequência, se preciso
  batch_size: 50             # sementes por consulta (OR de author ids)
  require_orcid: true        # semente precisa de ORCID (E1); demais critérios na higienização
  candidates_per_work: 1     # 1 autor sorteado por artigo — evita viés de tamanho de equipe
  seed: 42                   # embaralhamento reprodutível dos candidatos
  # Autores só de works acima do teto de coautores (filters.yaml) não contam para a
  # parada nem recebem consulta ORCID — não geram arestas (count_cap vem do teto).
  max_seeds: null            # opcional: teto de sementes

# Ordem esperada do gradiente (alto → baixo), usada em relatórios/figuras da H3.
gradiente: [medicina, computacao, matematica, economia]

bases:
  medicina:
    label: "Medicina"
    gradiente: true
    densidade_esperada: "alta (equipes grandes, colaborações recorrentes)"
    raw_dir: "data/raw_med"
    corpus: "data/processed/corpus_medicina.parquet"
    fields: [27]              # Medicine (domínio Health Sciences; ~52M works)
    expected_names: {27: "Medicine"}

  computacao:
    label: "Ciência da Computação"
    gradiente: true
    densidade_esperada: "intermediária"
    raw_dir: "data/raw_cs"
    corpus: "data/processed/corpus_computacao.parquet"
    fields: [17]              # Computer Science (domínio Physical Sciences; ~18M works)
    expected_names: {17: "Computer Science"}

  matematica:
    label: "Matemática"
    gradiente: true
    densidade_esperada: "baixa (artigos de 1–3 autores; polo esparso clássico)"
    raw_dir: "data/raw_math"
    corpus: "data/processed/corpus_matematica.parquet"
    fields: [26]              # Mathematics (domínio Physical Sciences; ~5,7M works)
    expected_names: {26: "Mathematics"}

  economia:
    label: "Economia"
    gradiente: true
    densidade_esperada: "baixa (artigos de 1–3 autores, rede esparsa)"
    raw_dir: "data/raw_econ"
    corpus: "data/processed/corpus_economia.parquet"
    fields: [20]              # Economics, Econometrics and Finance (Social Sciences; ~9M works)
    expected_names: {20: "Economics, Econometrics and Finance"}

  # --- Legado (Concepts): sub-campo de IA (5 sub-conceitos) — base de TODOS os experimentos
  # até out/2026. Fora do gradiente (granularidade diferente das demais); mantida
  # para reprodutibilidade dos resultados já publicados no repositório.
  ia:
    label: "Inteligência Artificial e correlatas (sub-campo, legado)"
    gradiente: false
    densidade_esperada: "intermediária"
    raw_dir: "data/raw_ai"
    corpus: "data/processed/corpus_ia.parquet"
    concepts:
      - "C154945302"       # Artificial intelligence
      - "C119857082"       # Machine learning
      - "C204321447"       # Natural language processing
      - "C31972630"        # Computer vision
      - "C108583219"       # Deep learning
    expected_names:
      C154945302: "Artificial intelligence"
      C119857082: "Machine learning"
      C204321447: "Natural language processing"
      C31972630: "Computer vision"
      C108583219: "Deep learning"
