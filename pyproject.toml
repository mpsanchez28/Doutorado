[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coauthor-rec"
version = "0.1.0"
description = "Recomendação de coautoria por predição de links em redes acadêmicas do OpenAlex (CNN + GNN)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Marcos Paulo Sanchez" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "networkx>=3.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "pyalex>=0.15",
]

[project.optional-dependencies]
# Módulos de 2027 (textual/relacional). Instalados sob demanda.
deep = ["torch>=2.2", "torch_geometric>=2.5", "transformers>=4.40"]
# Enriquecimento GenAI do KG (§4.3.3). Chaves via .env (gitignored).
enrich = ["openai>=1.40", "anthropic>=0.40", "python-dotenv>=1.0"]
dev = ["pytest>=7.4"]

[project.scripts]
coauthor-rec = "coauthor_rec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
